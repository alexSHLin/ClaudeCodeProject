<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="base" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b2a4a"/>
      <stop offset="0.55" stop-color="#061527"/>
      <stop offset="1" stop-color="#020812"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38e8ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse">
      <path d="M28 0L56 16V48L28 64L0 48V16Z M28 64V97" fill="none" stroke="#3a8bff" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow" r="50%">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#hex)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- 光暈 -->
  <circle cx="260" cy="200" r="320" fill="url(#glow)" opacity="0.5"/>
  <circle cx="1380" cy="820" r="380" fill="url(#glow)" opacity="0.45"/>

  <!-- 同心圓掃描環 -->
  <g fill="none" stroke="#38e8ff" transform="translate(1320 220)">
    <circle r="150" stroke-opacity="0.18"/>
    <circle r="110" stroke-opacity="0.12" stroke-dasharray="4 10"/>
    <circle r="190" stroke-opacity="0.1" stroke-dasharray="60 20 8 20"/>
    <path d="M0-190A190 190 0 0 1 164 95" stroke-opacity="0.45" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#3a8bff" transform="translate(220 800)">
    <circle r="120" stroke-opacity="0.15"/>
    <circle r="160" stroke-opacity="0.1" stroke-dasharray="3 9"/>
    <path d="M-160 0A160 160 0 0 1 0-160" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- 電路線 -->
  <g fill="none" stroke="#38e8ff" stroke-width="1.5" stroke-opacity="0.35" stroke-linejoin="round">
    <path d="M0 140H180L240 200H520L560 160H760"/>
    <path d="M0 420H120L180 480H340"/>
    <path d="M0 640H260L320 580H460L500 620H620"/>
    <path d="M1600 360H1420L1360 420H1120L1080 380H940"/>
    <path d="M1600 560H1480L1420 620H1240"/>
    <path d="M1600 900H1300L1240 840H1040"/>
    <path d="M620 1000V900L680 840H880L920 880H1000"/>
    <path d="M900 0V80L960 140H1160"/>
  </g>
  <g fill="#38e8ff">
    <circle cx="760" cy="160" r="4"/>
    <circle cx="340" cy="480" r="4"/>
    <circle cx="620" cy="620" r="4"/>
    <circle cx="940" cy="380" r="4"/>
    <circle cx="1240" cy="620" r="4"/>
    <circle cx="1040" cy="840" r="4"/>
    <circle cx="1000" cy="880" r="4"/>
    <circle cx="1160" cy="140" r="4"/>
  </g>
  <g fill="#38e8ff" opacity="0.6" filter="url(#blur)">
    <circle cx="760" cy="160" r="8"/>
    <circle cx="940" cy="380" r="8"/>
    <circle cx="1040" cy="840" r="8"/>
    <circle cx="340" cy="480" r="8"/>
  </g>

  <!-- 資料點陣 -->
  <g fill="#38e8ff" fill-opacity="0.25">
    <rect x="1440" y="40" width="6" height="6"/><rect x="1456" y="40" width="6" height="6"/>
    <rect x="1472" y="40" width="6" height="6"/><rect x="1456" y="56" width="6" height="6"/>
    <rect x="1488" y="56" width="6" height="6"/><rect x="1440" y="72" width="6" height="6"/>
    <rect x="60" y="920" width="6" height="6"/><rect x="76" y="920" width="6" height="6"/>
    <rect x="92" y="936" width="6" height="6"/><rect x="60" y="952" width="6" height="6"/>
  </g>

  <!-- 掃描線 -->
  <rect y="495" width="1600" height="2" fill="#38e8ff" opacity="0.06"/>
  <rect y="300" width="1600" height="1" fill="#38e8ff" opacity="0.05"/>
</svg>
