<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖片 AI 放大</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>圖片 AI 放大 <span class="tag">UPSCALE!</span></h1>
    <p class="sub">Real-ESRGAN 模型放大，輸出無損 PNG</p>

    <form id="form" class="form" novalidate>
      <label class="label" for="file">Upload Image：</label>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="選擇或拖入圖片">
        <input id="file" type="file" accept="image/*" hidden>
        <span id="dropText">按一下選擇圖片，或將圖片拖到這裡</span>
      </div>

      <label class="label" for="scale">放大倍數：</label>
      <input id="scale" class="scale" type="number" min="1.1" max="8" step="0.1" placeholder="例如 2（最大 8，可為小數）" inputmode="decimal">

      <span></span>
      <button id="start" class="start" type="submit" disabled>Start</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <span id="info"></span>
        <a id="download" class="download" href="#">下載放大圖</a>
      </div>
      <div id="viewport" class="viewport">
        <div id="compare" class="compare">
          <img id="after" class="img-after" alt="修復後">
          <img id="before" class="img-before" alt="修復前">
          <span class="badge badge-left">修復前</span>
          <span class="badge badge-right">修復後</span>
          <div id="handle" class="handle" role="slider" tabindex="0" aria-label="拖拉比較" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
        </div>
      </div>
      <label class="zoom">
        <input id="zoom" type="checkbox"> 以 100% 實際像素檢視（可捲動）
      </label>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
